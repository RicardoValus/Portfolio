<section class="hero" id="topo">
  <div class="accent-rule" aria-hidden="true"></div>
  <h1 class="hero-title">{{ site.name }}</h1>
  <p class="hero-headline">{{ profile.headline }}</p>
  <p class="hero-lead">{{ profile.valueProp }}</p>
  <div class="hero-actions">
    <a matButton="filled" href="#projetos">Ver projetos</a>
    <a matButton="outlined" [href]="site.cvUrl" download>Baixar currículo</a>
    <a matButton="outlined" [href]="mailto">Falar comigo</a>
  </div>
</section>
